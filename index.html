    <script>
      (function() {
        try {
          // Garante que window.fetch tenha getter e setter para que extensões do Chrome
          // e interceptores de requisição possam sobrescrever window.fetch sem erro de getter-only
          var _origFetch = window.fetch;
          var _activeFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _activeFetch; },
            set: function(newFetch) { _activeFetch = newFetch; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Impede que erros injetados por extensões do navegador afetem a aplicação
        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch of') !== -1 ||
              event.message.indexOf('fetch of #<Window>') !== -1
            ))
          )) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="notranslate" translate="no">
